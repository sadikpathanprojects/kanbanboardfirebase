<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanban Board (Firestore Realtime)</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #1e1e1e; color: white; display: flex; flex-direction: column; align-items: center; }
    h1 { margin: 20px 0; }
    .board { display: flex; gap: 15px; margin: 20px; flex-wrap: wrap; justify-content: center; }
    .column { background: #2e2e2e; padding: 10px; border-radius: 10px; width: 220px; min-height: 300px; }
    .column h2 { text-align: center; margin-bottom: 10px; }
    .task { background: #444; padding: 8px; margin: 5px 0; border-radius: 5px; cursor: grab; }
    .task[contenteditable="true"] { outline: 2px solid #4cafef; cursor: text; }
    .controls { margin: 15px; }
    #taskInput { width: 250px; padding: 8px; font-size: 16px; border-radius: 5px; border: none; }
    #taskColor { width: 40px; height: 40px; border: none; cursor: pointer; margin-left: 5px; vertical-align: middle; }
    button { margin: 5px; padding: 8px 14px; border: none; border-radius: 5px; background: #4cafef; color: white; cursor: pointer; font-size: 14px; }
    button:hover { background: #45a0e0; }
    #dustbin { background: #8b0000; }
    #dustbin h2 { color: #ffb3b3; }
  </style>
</head>
<body>
  <h1>Kanban Board (Firestore Realtime)</h1>

  <div class="controls">
    <input type="text" id="taskInput" placeholder="New Task" onkeypress="handleKeyPress(event)">
    <input type="color" id="taskColor" value="#444444">
    <button onclick="addTask()">Add to To-Do</button>
  </div>

  <div class="board">
    <div class="column" id="todo" ondrop="drop(event)" ondragover="allowDrop(event)"><h2>To-Do</h2></div>
    <div class="column" id="inprogress" ondrop="drop(event)" ondragover="allowDrop(event)"><h2>In Progress</h2></div>
    <div class="column" id="onhold" ondrop="drop(event)" ondragover="allowDrop(event)"><h2>On Hold</h2></div>
    <div class="column" id="completed" ondrop="drop(event)" ondragover="allowDrop(event)"><h2>Completed</h2></div>
    <div class="column" id="dustbin" ondrop="drop(event)" ondragover="allowDrop(event)"><h2>🗑 Dustbin</h2></div>
  </div>
  <div class="footer">Created by Sadik Pathan</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // TODO: Paste your actual config object from the Firebase Console here!
    const firebaseConfig = {
      projectId: "kanbanboard-285b1",
      apiKey: "YOUR_API_KEY",
      authDomain: "kanbanboard-285b1.firebaseapp.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "boards", "global-kanban");

    let dragged = null;

    window.addTask = function() {
      const input = document.getElementById("taskInput");
      const color = document.getElementById("taskColor").value;
      const text = input.value.trim();
      if (text === "") return;

      const task = createTaskElement(text, color);
      document.getElementById("todo").appendChild(task);
      input.value = "";
      window.saveBoard();
    };

    window.handleKeyPress = (e) => { if (e.key === "Enter") window.addTask(); };

    function createTaskElement(text, color = "#444444") {
      const task = document.createElement("div");
      task.className = "task";
      task.textContent = text;
      task.style.background = color;
      task.draggable = true;
      task.ondragstart = (e) => dragged = e.target;
      task.ondblclick = () => { task.contentEditable = true; task.focus(); };
      task.onblur = () => { task.contentEditable = false; window.saveBoard(); };
      task.onkeypress = (e) => { if (e.key === "Enter") { e.preventDefault(); task.blur(); } };
      return task;
    }

    window.allowDrop = (e) => e.preventDefault();
    window.drop = function(e) {
      e.preventDefault();
      if (dragged) {
        if (e.currentTarget.id === "dustbin") dragged.remove();
        else e.currentTarget.appendChild(dragged);
        window.saveBoard();
      }
    };

    function getTasks(id) {
      return Array.from(document.getElementById(id).querySelectorAll(".task"))
                  .map(t => ({ text: t.textContent, color: t.style.background }));
    }

    window.saveBoard = async function() {
      const data = {
        todo: getTasks("todo"),
        inprogress: getTasks("inprogress"),
        onhold: getTasks("onhold"),
        completed: getTasks("completed"),
      };
      await setDoc(docRef, data);
    };

    window.loadBoard = function() {
      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          ["todo", "inprogress", "onhold", "completed"].forEach(colId => {
            const col = document.getElementById(colId);
            col.querySelectorAll(".task").forEach(t => t.remove());
            (data[colId] || []).forEach(item => {
              col.appendChild(createTaskElement(item.text, item.color));
            });
          });
        }
      });
    };

    window.onload = window.loadBoard;
  </script>
</body>
</html>
